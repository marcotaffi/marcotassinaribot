name: formatta_semprenews
type: prompt
description: "Converte il testo nelle convenzioni di marcatura di semprenews.it (grassetti/corsivi, discorso diretto, shortcode immagini/citazioni/CTA)"
prompt: formatta_semprenews
agentName: aiengineer
# "corpo" quando incatenato dopo uno step di scrittura nella stessa procedura, "prompt" quando
# chiamato da solo come tool a sé (proceduratool_formattasemprenews) — vedi il commento su
# RiferimentoMateriale.campo in taffitools/procedure/types.ts.
materiale:
  - campo: [corpo, prompt]
    pick: last
    etichetta: "TESTO DA FORMATTARE (non modificarne il contenuto, solo la marcatura)"
    obbligatorio: true
# Cronologia (2026-09-29): questo step lavora solo sul proprio input esplicito (prompt +
# materiale dichiarato qui). Il resto della conversazione per lui è rumore e rischia di mescolare
# lavori diversi: dalla chat arrivavano fino a 73 messaggi di tre giorni (log di produzione del
# 28/09). Vedi CronologiaChiamata in taffitools/src/ai/types.ts.
cronologia: nessuna
