name: genera_prompt_cover_apg23
description: "Analizza l'articolo e descrive il soggetto della copertina per apg23.org"
type: prompt
prompt: genera_prompt_cover_apg23
agentName: artdirector
# Nel prompt entra solo ciò che è elencato qui (2026-10-09, vedi taffitools
# docs/passaggio-contenuti.md): l'articolo già scritto e le eventuali indicazioni dell'utente.
# Il materiale grezzo del feed non serve più: in ogni percorso c'è l'articolo scritto. Tutti
# facoltativi: basta che ce ne sia uno.
materiale:
  - campo: title
    etichetta: TITOLO
    obbligatorio: false
  - campo: excerpt
    etichetta: SOMMARIO
    obbligatorio: false
  # Il testo dell'articolo, non l'impaginazione: "corpo" è il markdown della bozza (pubblicazione
  # da chat) o l'HTML semplice di converti_html (flusso automatico); "text" è il ripiego, per la
  # copertina chiesta in chat (_copertina_apg23, che riceve il testo della bozza in "text"). Da
  # quando "text" contiene i blocchi dell'editor (2026-09-29) non va preferito a "corpo".
  - campo: [testoMarkdown, corpo, text]   # testoMarkdown: la pubblicazione da bozza (bozze.ts) lo passa; senza, corpo/text come prima
    etichetta: ARTICOLO
    obbligatorio: false
  # Le indicazioni dell'utente per la copertina (bozze_apg23_copertina le passa come "prompt").
  # Nella pubblicazione e sul feed "prompt" non c'è.
  - campo: prompt
    etichetta: "INDICAZIONI DELL'UTENTE PER LA COPERTINA (se ci sono, seguile)"
    obbligatorio: false
# Cronologia (2026-09-29): questo step lavora solo sul proprio input esplicito (prompt +
# materiale dichiarato qui). Il resto della conversazione per lui è rumore e rischia di mescolare
# lavori diversi: dalla chat arrivavano fino a 73 messaggi di tre giorni (log di produzione del
# 28/09). Vedi CronologiaChiamata in taffitools/src/ai/types.ts.
cronologia: nessuna
