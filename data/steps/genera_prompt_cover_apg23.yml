name: genera_prompt_cover_apg23
description: "Analizza l'articolo e descrive il soggetto della copertina per apg23.org"
type: prompt
prompt: genera_prompt_cover_apg23
agentName: artdirector
# "prompt" (richiesta dalla chat) e "materialeIniziale" (articolo dal feed) entrano da soli nel
# prompt; qui aggiungo l'articolo già scritto, che nei flussi di pubblicazione è il materiale
# più affidabile. Tutti facoltativi: basta che ce ne sia uno.
materiale:
  - campo: title
    etichetta: TITOLO
    obbligatorio: false
  - campo: excerpt
    etichetta: SOMMARIO
    obbligatorio: false
  # "text" quando arriva dalla pubblicazione di una bozza, "corpo" nel flusso automatico (l'HTML
  # impaginato, 2026-09-29: prima c'era il "text" del caporedattore, che non esiste più).
  - campo: [text, corpo]
    etichetta: ARTICOLO
    obbligatorio: false
# Cronologia (2026-09-29): questo step lavora solo sul proprio input esplicito (prompt +
# materiale dichiarato qui). Il resto della conversazione per lui è rumore e rischia di mescolare
# lavori diversi: dalla chat arrivavano fino a 73 messaggi di tre giorni (log di produzione del
# 28/09). Vedi CronologiaChiamata in taffitools/src/ai/types.ts.
cronologia: nessuna
