name: ufficiostampa
type: prompt
description: "Scrivi un testo per l'ufficio stampa."
prompt: giornalista
agentName: ufficiostampa
# Backstop deterministico (2026-09-15): primo step della propria procedura (ufficiostampa →
# genera_titoli → formatta_ai) — riceve il materiale vero SOLO da qui (il "prompt" passato da
# caporedattore tramite proceduratool_ufficiostampa), mai dagli step successivi della catena
# (quelli lo leggono invece dalla cronologia di sessione). Stesso schema, stesso bug possibile,
# stessa protezione di scrivi_rilancio — vedi il suo commento in taffitools/src/procedure/step.ts.
richiedeMateriale: true
# Backstop sull'output (2026-09-15, stesso motivo di ripubblica.yml — vedi il suo commento):
# senza questo controllo, se scraper_url_download fallisce l'agente potrebbe scrivere una scusa
# conversazionale invece di chiamare segnalaerrore, e nessuno se ne accorgerebbe finché
# formatta_ai non la impacchetta in HTML come se fosse un articolo vero.
validate: materiale_sufficiente
