name: revisiona
type: prompt
description: "Applica a una bozza la modifica richiesta, cambiando solo ciò che è chiesto"
prompt: revisiona
agentName: revisore
# Backstop deterministico, stesso schema di scrivi_rilancio/cronaca/ecc: senza una richiesta vera
# (arrivata come "prompt"), il modello non deve inventare una modifica plausibile.
richiedeMateriale: true
# La bozza da modificare, passata per intero dal servizio bozze_apg23 (azione "ritocca"). Esplicita
# e non ripescata dalla cronologia: in chat possono esserci più bozze, e va modificata quella giusta.
# La richiesta va elencata qui: con "materiale" dichiarato nel prompt entra solo ciò che è
# elencato (2026-10-09, vedi taffitools docs/passaggio-contenuti.md).
materiale:
  - campo: prompt
    pick: last
    etichetta: "RICHIESTA DI MODIFICA"
    obbligatorio: true
  - campo: testoDaModificare
    pick: last
    etichetta: "TESTO DELLA BOZZA DA MODIFICARE (lavora solo su questo; se lo cambi, restituiscilo intero)"
    obbligatorio: true
  - campo: title
    pick: last
    etichetta: "TITOLO ATTUALE"
    obbligatorio: false
  - campo: excerpt
    pick: last
    etichetta: "SOTTOTITOLO ATTUALE"
    obbligatorio: false
  - campo: linkBottone
    pick: last
    etichetta: "LINK ATTUALE DEL BOTTONE A FINE ARTICOLO (vuoto = nessun bottone)"
    obbligatorio: false
  - campo: testoBottone
    pick: last
    etichetta: "SCRITTA ATTUALE DEL BOTTONE A FINE ARTICOLO"
    obbligatorio: false
