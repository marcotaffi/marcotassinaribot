name: genera_prompt_immagine
description: "Scrive il prompt per l'immagine a partire dall'articolo o dalla richiesta in chat"
type: prompt
prompt: genera_prompt_immagine
agentName: artdirector
# "prompt" (richiesta da chat) e "materialeIniziale" (articolo dal feed) entrano da soli nel
# prompt (vedi step.ts, caso "prompt"); qui aggiungo i campi dell'articolo già scritto, che nei
# flussi di pubblicazione è il materiale più affidabile. Tutti facoltativi: basta che ce ne sia uno.
materiale:
  - campo: title
    etichetta: TITOLO
    obbligatorio: false
  - campo: excerpt
    etichetta: SOMMARIO
    obbligatorio: false
  - campo: text
    etichetta: ARTICOLO
    obbligatorio: false
