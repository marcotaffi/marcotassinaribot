name: comunicatostampa
type: prompt
description: "Scrivi un comunicato stampa."
prompt: comunicatostampa
agentName: ufficiostampa
# Backstop deterministico: primo step della propria procedura (comunicatostampa → genera_titoli →
# formatta_ai → impagina_apg23) — riceve il materiale vero SOLO da qui (il "prompt" passato da
# caporedattore tramite proceduratool_comunicatostampa, attivata il 2026-09-24), mai dagli step
# successivi della catena. Stesso schema, stessa protezione di scrivi_rilancio — vedi il suo
# commento in taffitools/src/procedure/step.ts.
richiedeMateriale: true
# Backstop sull'output (2026-09-15, stesso motivo di ripubblica.yml — vedi il suo commento):
# senza questo controllo, se lo scraping fallisce l'agente potrebbe scrivere una scusa
# conversazionale invece di chiamare segnalaerrore, e nessuno se ne accorgerebbe finché
# formatta_ai non la impacchetta in HTML come se fosse un articolo vero.
validate: materiale_sufficiente
