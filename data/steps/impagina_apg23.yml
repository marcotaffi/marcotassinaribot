name: impagina_apg23
type: prompt
description: "Impagina l'HTML semplice (da converti_html) nei blocchi dell'editor di apg23.org (sezioni acf/titolo-paragrafo-pulsante)"
# (2026-09-29) Blocchi dell'editor invece del blocco HTML unico del tema: vedi prompts/impagina_apg23.yml.
# Il validatore controlla testo, titoli, link, bottone e codici dei campi (data/validators/).
validate: blocchi_wordpress
prompt: impagina_apg23
agentName: aiengineer
# (2026-09-18) Separato da formatta_ai: prima un solo step faceva insieme conversione
# markdown→html E impaginazione a blocchi, e a volte non convertiva tutto il markdown negli
# articoli più lunghi/con più titoli. Diviso in due step più semplici — qui SOLO impaginazione,
# l'HTML in ingresso è già pronto e non va modificato nel contenuto, solo incollato nel
# contenitore giusto (vedi prompts/impagina_apg23.yml).
# "corpo" quando incatenato dopo converti_html (prima formatta_ai) nella stessa procedura, "prompt" come ripiego
# (2026-09-24) quando questo step è chiamato da solo come tool a sé (proceduratool_impaginaapg23)
# — vedi il commento su RiferimentoMateriale.campo in taffitools/procedure/types.ts.
materiale:
  - campo: [corpo, prompt]
    pick: last
    etichetta: "HTML DA IMPAGINARE (non modificarne il contenuto, solo l'impaginazione)"
    obbligatorio: true
  # Il bottone a fine articolo (2026-09-29): fonte o invito all'azione, deciso dallo step che scrive
  # (vedi snippets/regole_bottone.md) o cambiato dall'utente in chat. Arriva con due nomi usati solo
  # per questo — linkBottone/testoBottone — sia in catena (dallo step di scrittura) sia da chat
  # (parametri di proceduratool_impaginaapg23). Prima si leggevano "link"/"fonteNome" SOLO dallo
  # step ripubblica (daStep): "link" è anche l'indirizzo del NOSTRO articolo appena pubblicato, e
  # senza quel vincolo un articolo su Cerea è uscito col bottone verso un articolo su Bologna
  # (2026-09-22). Con nomi propri il vincolo non serve più, e il bottone vale per ogni categoria.
  - campo: linkBottone
    pick: last
    etichetta: "LINK DEL BOTTONE (se non vuoto, aggiungi il bottone a fine articolo secondo la sezione BOTTONE del tuo prompt; se vuoto, nessun bottone)"
    obbligatorio: false
  - campo: testoBottone
    pick: last
    etichetta: "TESTO DEL BOTTONE (la scritta esatta sul bottone)"
    obbligatorio: false
# Cronologia (2026-09-29): questo step lavora solo sul proprio input esplicito (prompt +
# materiale dichiarato qui). Il resto della conversazione per lui è rumore e rischia di mescolare
# lavori diversi: dalla chat arrivavano fino a 73 messaggi di tre giorni (log di produzione del
# 28/09). Vedi CronologiaChiamata in taffitools/src/ai/types.ts.
cronologia: nessuna
