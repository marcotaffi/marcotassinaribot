cosafa: "Transcribes the most recent audio (voice message or audio file) the user sent in this chat. ALWAYS use it when the user asks to transcribe an audio or to get its text. The transcription is automatically sent to the user as a .txt file attached in chat: do NOT repeat the text in your reply, just tell the user the file has arrived (the tool result also gives you the text, for your own use, e.g. to summarize it or work on it if asked). 'prompt' can stay short. It cannot read text aloud or generate audio."
