# Bozze di articoli per apg23.org (2026-09-29, revisione strutturale): il servizio con cui la chat
# scrive, ritocca, vede in anteprima e pubblica — lavorando sulla "bozza n. X", senza mai ricopiare
# testi o campi da un passaggio all'altro. Un articolo GIÀ pubblicato si modifica aprendolo come
# bozza collegata (azione "apri": i blocchi del sito diventano markdown); salvarla lo aggiorna.
# Sul sito il testo va nei blocchi dell'editor (sezioni acf/titolo-paragrafo-pulsante), scritti
# dall'agente di impaginazione e controllati dal validatore blocchi_wordpress (_anteprima_apg23).
# Vedi taffitools/src/servizi/bozze.ts e utils/blocchiwp.ts.
firma: bozze_apg23
servizio: bozze
destinazione: apg23
opzioni:
  scrittura: _scrivi
  revisione: _revisiona
  anteprima: _anteprima_apg23
  pubblicazione: ripubblica_apg23_invia
  lettura: wordpress_apg23_leggiArticolo
  aggiornamento: wordpress_apg23_aggiornaArticolo
  # Dove cercare un articolo da aprire, in ordine (di solito non si sa se è un articolo o un evento).
  tipiArticolo: [posts, eventi]
  # L'immagine trovata nel materiale diventa la copertina solo per un rilancio (categoria "ripubblica": è
  # l'immagine dell'articolo che si rilancia). Per un testo nuovo scritto prendendo spunto da un link
  # (cronaca, dossier...) quell'immagine, spesso il logo del sito, viene scartata e la copertina nasce
  # da sola nello stile del sito (09/10/2026, produzione: il logo APG23 era finito come copertina).
  immagineSoloDaCategorie: [ripubblica]
  esportazioni:
    semprenews: _formattasemprenews
  # Copertina su richiesta, con i provini del sito (stessa procedura della copertina automatica).
  copertina: _copertina_apg23
  stati: [draft, publish]
  # Campi che la chat può cambiare direttamente (azione "modifica"), senza passare dal revisore:
  # nome → cosa è. La descrizione la legge la chat (così non confonde, per esempio, la data di un
  # evento con la data dell'articolo) e la sua prima parte fa da nome nel riepilogo di conferma.
  campiBrevi:
    title: titolo dell'articolo
    excerpt: sottotitolo, il riassunto che compare sotto il titolo
    date: data di pubblicazione, cioè la data dell'articolo sul sito, nel formato AAAA-MM-GG oppure AAAA-MM-GGThh:mm. Una data futura rende l'articolo programmato, non visibile fino a quel giorno
    postType: tipo di contenuto sul sito, posts (articolo) oppure eventi
    image: immagine di copertina, un indirizzo web o il riferimento di un'immagine generata in chat
    imageCredit: autore della foto di copertina
    data_in_forma_testuale: data dell'evento scritta in parole, solo per gli eventi (non è la data dell'articolo)
    luogo_evento: luogo dell'evento, solo per gli eventi
    yoast_title: titolo SEO
    yoast_metadesc: meta description SEO
    linkBottone: link del bottone a fine articolo, dove porta
    testoBottone: scritta del bottone a fine articolo
    fonte: fonte dell'articolo (id della categoria fonte sul sito)
    author: autore dell'articolo (id dell'utente sul sito)
  # Campi dell'articolo che si leggono dal sito quando lo si apre e si riportano quando lo si
  # aggiorna, oltre al contenuto (testo e bottone). Gli altri cambiati nella bozza vengono segnalati
  # nel riepilogo come "da cambiare dal sito".
  campiSito: [title, excerpt, date, yoast_title, yoast_metadesc]
