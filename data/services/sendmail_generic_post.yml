firma: "sendmail_generic_post"
servizio: "sendmail"
destinazione: "generic" #usata per costruire le firme chiamabili da ai
azione: "post"
opzioni:
  # Invio mail via Gmail API (OAuth2). Richiede in credenziali googleClientId /
  # googleClientSecret / googleRefreshToken (vedi taffitools/src/api/googleapi.ts e
  # taffitools/src/servizi/mailservice.ts). Esplicito qui per chiarezza, ma dal 2026-09-18 è
  # anche il default del servizio (IFTTT non è attivo) — anche senza questa riga sarebbe gmail.
  provider: "gmail"
