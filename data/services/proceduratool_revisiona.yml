firma: proceduratool_revisiona
servizio: proceduratool
destinazione: revisiona
procedura: _revisiona
azione: esegui
cosafa: "This tool PROPOSES a change to a piece of content, without writing anything — including formatting changes (internal headings, bold/italic, lists, paragraph order) and title changes. Pass in 'prompt' what to change, in the user's words. To change the DRAFT of this conversation (not yet published), also pass the current draft text in full in 'testoDaModificare'. If you have an explicit reference to an already-published apg23.org article (link, slug or id), include it. If instead the user gave you material directly (a PDF, a document, pasted text, a link) without saying whether/where it's already published, don't guess: the tool will ask the user directly whether it's an update to something already published (in which case it needs the link/slug/id) or brand-new material. Returns the proposed final values field by field (empty = unchanged), plus 'cosaCambia' (what changes) and 'domanda' (a question for the user, if it needs one), for you to show the user and get explicit confirmation before applying."
# (2026-09-29) Caso C: modificare la bozza di questa conversazione, passata per intero.
opzioni:
  parametriExtra:
    testoDaModificare:
      type: ["string", "null"]
      description: "Only to change the DRAFT of this conversation (not yet published): its current text, pasted in full, word for word, in the format it is now (raw markdown, or apg23 HTML if it was already laid out). Null for an already-published article or material given by the user."
