firma: proceduratool_revisiona
servizio: proceduratool
destinazione: revisiona
procedura: _revisiona
azione: esegui
cosafa: "This tool PROPOSES a change to a piece of content, without writing anything. Pass in 'prompt' what to change, in the user's words. If you have an explicit reference to an already-published apg23.org article (link, slug or id), include it. If instead the user gave you material directly (a PDF, a document, pasted text, a link) without saying whether/where it's already published, don't guess: the tool will ask the user directly whether it's an update to something already published (in which case it needs the link/slug/id) or brand-new material. Returns a clear before/after summary of what would change, for you to show the user and get explicit confirmation before actually applying it with wordpress_apg23_aggiornaArticolo / wordpress_apg23_aggiornaMedia."
