firma: "wordpress_apg23"
# Questo file definisce il bot telegram e il canale automatico
servizio: "wordpress"
destinazione: "apg23" #usata per costruire le firme chiamabili da ai
procedura: "orchestra" #!!! procedura eseguita dalla run, che è un servizio disponibile al bot per scrivere !!!
opzioni:
  sito: "www.apg23.org" # usato per costruire le descrizoni dei tools per ai
  basic_auth: "APG23_WORDPRESS"
  status: "draft"
  postTypes: 
    - posts #default
    - eventi
  #  - campagne
  #  - storie
  #  - persone
  #  - progetti 
  categoryMapping:
      "*": "1"

# classificazione: canale automatico ATTIVO. La pubblicazione automatica su apg23 da
# semprenews.it è migrata da semprebot a marcotassinaribot (semprebot va spento per
# evitare pubblicazioni doppie). Il rilancio passa dalla procedura "orchestra" ->
# caporedattore, che per contenuti già pubblicati su semprenews.it sceglie il tool
# proceduratool_ripubblica (vedi instructions_caporedattore.md, Categoria E).
classificazione:
  includi:
    - hooks: ["semprenews.it/tag/Comunita-Papa-Giovanni-XXIII"]
      type: "feeds"
      flusso: "Instant"


