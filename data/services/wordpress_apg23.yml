firma: "wordpress_apg23"
# Questo file definisce il bot telegram e il canale automatico
servizio: "wordpress"
destinazione: "apg23" #usata per costruire le firme chiamabili da ai
procedura: "orchestra" #!!! procedura eseguita dalla run, che è un servizio disponibile al bot per scrivere !!!
opzioni:
  sito: "www.apg23.org" # usato per costruire le descrizoni dei tools per ai
  basic_auth: "APG23_WORDPRESS"
  status: "draft"
  postTypes: 
    - posts #default
    - eventi
  #  - campagne
  #  - storie
  #  - persone
  #  - progetti 
  categoryMapping:
      "*": "1"

# classificazione DISATTIVATA il 2026-09-18 (migrazione a CanaleFlusso, vedi
# services/ripubblica_apg23.yml per la storia completa): questo canale (Wordpress diretto)
# resta nel codice — "run"/"post" restano metodi veri, richiamati internamente dagli step
# wordpress_scrivi/wordpress_pubblica — ma non riceve più traffico dal feed né chiamate dirette
# dall'AI in chat (vedi Wordpress.azioniNonEsposteAllAI). L'ha preso in carico ripubblica_apg23,
# con la stessa identica classificazione. Lasciare ENTRAMBI i blocchi "classificazione" attivi
# pubblicherebbe ogni articolo due volte.
