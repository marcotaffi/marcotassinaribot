firma: proceduratool_dossier
servizio: proceduratool
destinazione: dossier 
procedura: dossier
azione: esegui 
cosafa: This tool can write or edit long-form dossiers, thematic reports, and in-depth narrative articles, organizing extended material, context, data, and documented stories into structured analytical content.
# soloTesto (2026-09-24, specifico di marcotassinaribot — vedi proceduratool.ts, opzioni.parametriExtra):
# se true, la procedura si ferma dopo il titolo, senza formattare per apg23 (vedi procedure/dossier.yml).
opzioni:
  parametriExtra:
    soloTesto:
      type: ["boolean", "null"]
      description: "If true, stop after writing the title/excerpt — skip HTML formatting and apg23 page layout. Use null for the normal full pipeline."
