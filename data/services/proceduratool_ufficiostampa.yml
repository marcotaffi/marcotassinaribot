firma: proceduratool_ufficiostampa
servizio: proceduratool
destinazione: ufficiostampa 
procedura: ufficiostampa
azione: esegui 
cosafa: "This tool can write or edit the text of: press releases, editorial products launches, event announcements on behalf of the press office of Comunità Papa Giovanni XXIII."
# soloTesto (2026-09-24, specifico di marcotassinaribot — vedi proceduratool.ts, opzioni.parametriExtra):
