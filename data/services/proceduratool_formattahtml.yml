firma: proceduratool_formattahtml
servizio: proceduratool
destinazione: formattahtml
procedura: _formattahtml
azione: esegui
cosafa: "This tool converts an already-written text into clean semantic HTML (headings, bold, italics, links, lists) — plain, portable markup with no site-specific page layout. Pass the full text to format in 'prompt'. Use this when the user wants a simple HTML version of a text, NOT specifically the apg23.org page layout (for that, use proceduratool_impaginaapg23 afterwards)."
# override della descrizione di default di "prompt" (vedi proceduratool.ts, opzioni.parametriExtra):
# quella condivisa ("your SHORT prompt describing...") è pensata per i tool che scrivono contenuto
# nuovo da un'istruzione breve (scrivitesto, revisiona...) — per un tool che trasforma un testo già
# dato serve dire l'opposto, altrimenti il chiamante manda una descrizione invece del testo vero
# (bug reale osservato il 2026-09-25: formattahtml chiamato con un riassunto del compito al posto
# dell'articolo).
opzioni:
  parametriExtra:
    prompt:
      type: "string"
      description: "The exact, complete text to convert — paste it here in full, word for word. Do not describe it, summarize it, or say where to find it: whatever you write here is exactly what gets converted, nothing more."
