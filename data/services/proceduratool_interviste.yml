firma: proceduratool_interviste
servizio: proceduratool
destinazione: interviste 
procedura: interviste
azione: esegui 
cosafa: This tool can tell stories, write or edit interviews and first-person testimonies, preserving the speaker’s voice and statements, structuring questions and answers or narrative testimony from provided material.
# soloTesto (2026-09-24, specifico di marcotassinaribot — vedi proceduratool.ts, opzioni.parametriExtra):
# se true, la procedura si ferma dopo il titolo, senza formattare per apg23 (vedi procedure/interviste.yml).
opzioni:
  parametriExtra:
    soloTesto:
      type: ["boolean", "null"]
      description: "If true, stop after writing the title/excerpt — skip HTML formatting and apg23 page layout. Use null for the normal full pipeline."
