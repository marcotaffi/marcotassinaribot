firma: proceduratool_formattasemprenews
servizio: proceduratool
destinazione: formattasemprenews
procedura: _formattasemprenews
azione: esegui
cosafa: "This tool formats an already-written text according to semprenews.it's markup conventions (bold/italic rules, direct-speech format, h2/h3 structure, image/quote/CTA shortcodes with sequential placeholder image IDs to be completed manually). Pass the full text to format in 'prompt'. The output is text to paste manually into semprenews.it's own publishing tool — this does NOT publish or upload anything."
# override della descrizione di default di "prompt": vedi lo stesso commento in
# proceduratool_formattahtml.yml.
opzioni:
  # (2026-09-29) Solo il testo passato in "prompt", nessuna cronologia della chat (vedi
  # AISession.cloneSandbox in taffitools). Prima questo tool riceveva l'intera conversazione
  # (fino a 73 messaggi, tre giorni di lavori diversi): il 28/09 ha formattato una proposta
  # vecchia rimasta in chat al posto del testo appena approvato, tre volte di fila.
  contesto: soloRichiesta
  parametriExtra:
    prompt:
      type: "string"
      description: "The exact, complete text to format — paste it here in full, word for word. Do not describe it, summarize it, or say where to find it: whatever you write here is exactly what gets formatted, nothing more."
