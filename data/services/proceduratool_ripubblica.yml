firma: proceduratool_ripubblica
servizio: proceduratool
destinazione: ripubblica
procedura: ripubblica
azione: esegui
cosafa: "This tool can rewrite and relaunch a news article or event already published in full on an external source (e.g. semprenews.it) into a short, ready-to-publish relaunch text for apg23.org, preserving the original meaning and linking back to the source."
# soloTesto (2026-09-24, specifico di marcotassinaribot — vedi proceduratool.ts, opzioni.parametriExtra):
# se true, la procedura si ferma dopo il titolo, senza formattare per apg23 (vedi procedure/ripubblica.yml).
opzioni:
  parametriExtra:
    soloTesto:
      type: ["boolean", "null"]
      description: "If true, stop after writing the title/excerpt — skip HTML formatting and apg23 page layout. Use null for the normal full pipeline."
