firma: segnalazioneeventi_apg23
servizio: canaleflusso
destinazione: apg23
flussi:
  principale: segnalazioneeventi
  # NON aggiungere qui un alias chat-testabile ("prova: segnalazioneeventi") senza pensarci: un
  # flusso non-"principale" invocato da chat salta preRun (vedi canaleflusso.ts, commento su
  # preRun) — ma gli step di questa procedura (es. cercatesto_semprenews, campo: articolo)
  # leggono campi che SOLO preRun produce. A differenza di ghost_giraffiamo (dove "scrivi"/"invia"
  # funzionano da chat perché riusano Ghost.run/post, che gestiscono da soli il proprio argomento
  # "prompt", indipendentemente da CanaleFlusso), qui un alias del genere girerebbe con materiale
  # vuoto — non un vero test. Provato e scartato il 2026-09-15.
opzioni:
  lunghezzaMinima: 50  # soglia bassa: pagine evento spesso brevi, basta scartare scraping vuoti

# classificazione: il canale si iscrive agli articoli/eventi che arrivano dalla fonte apg23
# eventi dichiarata in src/marcotassinaribot.ts (feeds[]). Da verificare contro un'esecuzione
# reale di taffiserver prima di andare in produzione: non ho potuto testare la corrispondenza
# hook<->classificazione end-to-end in questa sessione (nessun bot live in ascolto).
classificazione:
  includi:
    - hooks: ["apg23.org/news-ed-eventi"]
      type: "feeds"
      flusso: "Instant"
  escludi: []
