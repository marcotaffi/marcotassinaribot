# Istanza SEPARATA del canale wordpress_apg23, con "azione" fissa: Servizio.getFunzioni()
# (taffitools/src/servizi/servizio.ts) filtra generaDescrizione() a questa sola azione quando
# "azione" è presente in configurazione. La usa il servizio bozze_apg23 (opzione "lettura") per
# aprire un articolo pubblicato come bozza; nessun agente la ha fra i suoi tool (2026-09-29).
# "destinazione" deve restare "apg23" perché la firma generata a runtime
# (wordpress_${destinazione}_leggiArticolo) deve combaciare esattamente con quella in bozze_apg23.yml.
firma: "wordpress_apg23_leggiArticolo"
servizio: "wordpress"
destinazione: "apg23"
azione: "leggiArticolo"
opzioni:
  sito: "www.apg23.org"
  basic_auth: "APG23_WORDPRESS"
  postTypes:
    - posts #default
    - eventi
