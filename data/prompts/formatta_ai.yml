name: formatta_ai
description: "Converte il markdown dell'articolo in HTML semantico pulito — solo sintassi, nessuna impaginazione: quella è un secondo step separato (vedi impagina_apg23), specifico del sito di destinazione."
# TODO (2026-09-18): questo step è una chiamata AI per un compito che potrebbe diventare
# deterministico (nessun giudizio editoriale, solo sintassi markdown→html) — vedi il TODO
# completo in taffitools/src/servizi/servizio.ts (getHandler), proposta di un servizio condiviso
# "TextEdit". Non implementato ora.
# (2026-09-18) Prima questo stesso step faceva ANCHE l'impaginazione a blocchi per apg23 nello
# stesso giro: conversione markdown→html E riorganizzazione in blocchi HTML del tema, nello
# stesso prompt. Bug reale osservato in produzione: markdown non convertito del tutto (asterischi
# rimasti alla lettera) proprio negli articoli più lunghi/con più titoli — cioè quelli che
# richiedevano anche più lavoro di riorganizzazione in blocchi. Diviso in due step più semplici,
# ciascuno con un solo compito: qui solo conversione di sintassi (markdown → html), la
# riorganizzazione/impaginazione specifica del sito è un secondo step (impagina_apg23) che
# riceve l'HTML già pronto e si limita a incollarlo nel contenitore giusto.
prompt: >
    Converti il testo markdown fornito in HTML semantico pulito. Solo conversione di sintassi:
    NON riorganizzare la struttura, NON dividere in blocchi, NON avvolgere in contenitori — un
    altro step si occupa dell'impaginazione dopo di te. Restituisci un unico frammento HTML
    lineare, dall'inizio alla fine del testo, nello stesso ordine dell'originale.


    ═══════════════════════════════════════
    REGOLE DI CONVERSIONE
    ═══════════════════════════════════════

    - Ogni titolo di livello 2 (##) del markdown → <h2>Titolo</h2>, nel punto esatto in cui compare.
    - Ogni titolo di livello 3 (###) del markdown → <h3>Titolo</h3>, nel punto esatto in cui compare.
    - Ogni paragrafo → <p>Testo</p>
    - Separa i paragrafi (anche a cavallo di un titolo) con un separatore <p>&#8203;</p>
    - Frasi e parole in grassetto (**testo** nel markdown originale) → SEMPRE <strong>frase o parola</strong>: non deve MAI restare un doppio asterisco letterale nell'HTML finale, in nessun punto del testo.
    - Nomi e cognomi di persona → <strong>Nome Cognome</strong>
    - Frasi e parole in corsivo (*testo* nel markdown originale) → SEMPRE <em>frase o parola</em>: non deve MAI restare un singolo asterisco letterale nell'HTML finale, in nessun punto del testo.
    - Nomi di associazioni/enti → <em>Nome</em>
    - Eventi o progetti → <em>&quot;Nome&quot;</em>
    - Citazioni → &laquo;testo&raquo;
    - Elenchi puntati → <ul><li>…</li></ul>
    - Elenchi numerati → <ol><li>…</li></ol>
    - Link → <a target="_blank" href="URL">testo</a>


    ═══════════════════════════════════════
    NOTE TECNICHE
    ═══════════════════════════════════════

    - Non modificare il contenuto.
    - Non inventare titoli h2/h3 che non esistono nel markdown originale.
    - Non riassumere.
    - Non aggiungere parole.
    - Non duplicare paragrafi: ogni frase del testo originale compare in output UNA VOLTA SOLA.
    - Non cambiare l'ordine.
    - Non riformulare.
    - Limita al massimo la creatività: applica solo trasformazioni meccaniche.


    ═══════════════════════════════════════
    OUTPUT
    ═══════════════════════════════════════

    - Restituisci SOLO l'HTML convertito: nessun <div>, nessun contenitore, nessun wrapper — solo h2/h3/p/strong/em/a/ul/ol/li, come da regole sopra.
    - Nessun testo aggiuntivo.
    - Nessuna spiegazione.
    - NON avvolgere l'output in un blocco di codice markdown (niente ```html iniziale né ``` finale): scrivi l'HTML puro e basta.
    - Verifica finale: non c'è nessun asterisco letterale (* o **) rimasto nell'HTML — se ne trovi uno, è markdown non convertito: sostituiscilo con <strong>/<em> prima di restituire l'output.
