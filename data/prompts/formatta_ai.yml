name: formatta_ai
description: "Formatta l'articolo centrale per sito Apg23"
prompt: >
    Applica al testo dell'articolo le trasformazioni seguenti, per formattarlo in HTML.

    IMPORTANTE

    - Non modificare il contenuto.
    - Non riassumere.
    - Non aggiungere parole. 
    - Non inventare sezioni.  
    - Non cambiare l’ordine.  
    - Non riformulare.
    - Limita al massimo la creatività: applica solo trasformazioni meccaniche.


    REGOLE STRUTTURALI (FONDAMENTALE)

    - L’intero articolo deve essere racchiuso in UN SOLO blocco HTML.
    - NON creare più blocchi.
    - NON usare <div class="PageTitleSmall">.
    - NON spezzare il contenuto in sezioni separate.

    Struttura OBBLIGATORIA:

    <div class="BlockWrapperContainer  Block-titolo-paragrafo-pulsante" style="background-color:#FFFFFF; margin-top:; margin-bottom:; height:">
      <div class="BlockMainContainer SiteWidth">
        <div class="BlockWrapper BlockTitoloParagrafoPulsante SiteWidth">
          <div class="BodyText">

            CONTENUTO QUI

          </div>
        </div>
      </div>
    </div>


    REGOLE DI CONVERSIONE MARKDOWN → HTML

    TITOLI
    - ## Titolo sezione → <h2>Titolo sezione</h2>
    - ### Titolo sezione → <h3>Titolo sezione</h3>

    IMPORTANTE:
    - I titoli NON devono creare nuovi blocchi
    - Devono restare dentro <div class="BodyText">


    PARAGRAFI
    - Ogni paragrafo → <p>Testo</p>
    - NON inserire <p> vuoti
    - NON inserire &nbsp;
    - NON duplicare tag </p>


    FORMATTAZIONE DEL TESTO
    - Nomi e cognomi di persona → <strong>Nome Cognome</strong>  
    - Frasi rilevanti → <strong>frase</strong>  
    - Nomi di associazioni/enti → <i>Nome</i>  
    - Eventi o progetti → <em>&quot;Nome&quot;</em>  
    - Citazioni → &laquo;testo&raquo;  
    - Elenchi puntati → <ul><li>…</li></ul>  
    - Elenchi numerati → <ol><li>…</li></ol>  
    - Link → <a target="_blank" href="URL">testo</a>  


    VINCOLI HTML (CRITICO)

    - HTML deve essere valido
    - Nessun tag chiuso in eccesso
    - Nessun </p> senza <p>
    - Nessuna chiusura duplicata
    - Struttura DOM pulita e lineare


    FONTE (SE PRESENTE)

    Alla fine del contenuto, dentro BodyText, aggiungere:

    <div class="MainButtonBlockContainer PulsanteLeft">
      <a class="MainButton MainButtonDark" href="LINK_ARTICOLO_ORIGINALE" target="_blank">
        Leggi l’articolo originale su semprenews.it
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>


    OUTPUT

    - Restituisci SOLO l’HTML finale
    - Nessun testo aggiuntivo
    - Nessuna spiegazione