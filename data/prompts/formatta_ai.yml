name: formatta_ai
description: "Formatta l'articolo centrale per sito Apg23"
prompt: >
    Applica al testo dell'articolo le trasformazioni seguenti, per formattarlo in blocchi sucessivi di codice HTML.

    IMPORTANTE

    - Non modificare il contenuto.
    - Non riassumere.
    - Non aggiungere parole. 
    - Non inventare sezioni.  
    - Non cambiare l’ordine.  
    - Non riformulare.
    - Limita al massimo la creatività: applica solo trasformazioni meccaniche.


    REGOLE STRUTTURALI

    - Ogni tiolo li livello 2 → un nuovo blocco  
    - Ogni blocco va formattato così:

    <div class="BlockWrapperContainer  Block-titolo-paragrafo-pulsante" style="background-color:#FFFFFF; margin-top:; margin-bottom:2%; height:">
      <div class="BlockMainContainer SiteWidth">
        <div class="BlockWrapper BlockTitoloParagrafoPulsante SiteWidth">
          <div class="BodyText">           
             <div class="PageTitleSmall">
                TITOLO ARGOMENTO DI LIVELLO 2 QUI   
             </div>
             <div class="BodyText">
               <p>
                 ARGOMENTO TESTUALE QUI DIVISO IN P
               </p>
              
             </div>
          </div>
        </div>
      </div>
    </div>



    REGOLE DI FORMATTAZIONE DEL TESTO

    - Ogni titolo di livello 3 → <H3></H3>
    - Ogni paragrafo → <p>Testo</p>
    - Frasi in grassetto → <strong>frase</strong>  
    - Nomi e cognomi di persona → <strong>Nome Cognome</strong>  
    - Frasi chiave per la comprensione del testo → <strong>frase</strong>  
    - Nomi di associazioni/enti → <i>Nome</i>  
    - Eventi o progetti → <em>&quot;Nome&quot;</em>  
    - Citazioni → &laquo;testo&raquo;  
    - Elenchi puntati → <ul><li>…</li></ul>  
    - Elenchi numerati → <ol><li>…</li></ol>  
    - Link → <a target="_blank" href="URL">testo</a>  


    FONTE (SE PRESENTE)

    Solo se conosci la fonte dell'articolo originale, alla fine del contenuto aggiungi dentro l'ultimo BodyText :

      <div class="MainButtonBlockContainer PulsanteLeft">
        <a class="MainButton MainButtonDark" href="LINK_ARTICOLO_ORIGINALE" target="_blank">
          Leggi l’articolo originale su NOME SITO
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>


    OUTPUT

    - Restituisci SOLO l’HTML finale, costituito da una serie di blocchi
    - Nessun testo aggiuntivo
    - Nessuna spiegazione


    ESEMPIO

    <div class="BlockWrapperContainer  Block-titolo-paragrafo-pulsante" style="background-color:#FFFFFF; margin-top:; margin-bottom:2%; height:">
      <div class="BlockMainContainer SiteWidth">
        <div class="BlockWrapper BlockTitoloParagrafoPulsante SiteWidth">
          <div class="BodyText">           
             <div class="PageTitleSmall">
                Primo argomento interessante di esempio   
             </div>
             <div class="BodyText">
               <p>
                 Questo è un argomento <strong>molto interessante</strong> che merita di essere approfondito.
               </p>
             </div>
          </div>
        </div>
      </div>
    </div>
    <div class="BlockWrapperContainer  Block-titolo-paragrafo-pulsante" style="background-color:#FFFFFF; margin-top:; margin-bottom:2%; height:">
      <div class="BlockMainContainer SiteWidth">
        <div class="BlockWrapper BlockTitoloParagrafoPulsante SiteWidth">
          <div class="BodyText">           
             <div class="PageTitleSmall">
                Secondo argomento interessante di esempio   
             </div>
             <div class="BodyText">
               <p>
                 Questo è un argomento poco interessante che non merita di essere approfondito.
               </p>
             </div>
          </div>
        </div>
      </div>
    </div>
    <div class="BlockWrapperContainer  Block-titolo-paragrafo-pulsante" style="background-color:#FFFFFF; margin-top:; margin-bottom:2%; height:">
      <div class="BlockMainContainer SiteWidth">
        <div class="BlockWrapper BlockTitoloParagrafoPulsante SiteWidth">
          <div class="BodyText">           
             <div class="PageTitleSmall">
                Terzo argomento interessante di esempio   
             </div>
             <div class="BodyText">
               <p>
                 Questo è un argomento aggiuntivo che serve come esempio. Tutto l'articolo proviene da un sito esterno.
               </p>              
             </div>
             <div class="MainButtonBlockContainer PulsanteLeft">
               <a class="MainButton MainButtonDark" href="http://www.example.it" target="_blank">
                 Leggi l’articolo originale su Example.it
                 <i class="fa-solid fa-arrow-right"></i>
               </a>
             </div>
          </div>
        </div>
      </div>
    </div>

