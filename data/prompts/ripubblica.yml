name: ripubblica
# "link" separato da "corpo" (2026-09-17): prima il link alla fonte non veniva chiesto qui,
# nell'idea che formatta_ai lo trovasse da solo "dalla conversazione" — bug reale osservato lo
# stesso giorno, un articolo pubblicato senza il bottone fonte: formatta_ai gira stateless e deve
# ripescare l'URL giusto da una cronologia ricostruita e rumorosa (messaggio utente, chiamate
# tool...), non sempre ci riesce. "ripubblica" l'URL lo riceve già (lo passa a
# scraper_url_download), quindi lo restituisce anche lui, come campo a sé — formatta_ai lo legge
# ora esplicitamente con "materiale" (vedi steps/formatta_ai.yml), stessa affidabilità già
# ottenuta oggi per "corpo".
params:
 type:
    - corpo
    - link
prompt: |
  Agisci come caporedattore ed esperto di comunicazione, per scrivere un breve testo di rilancio dell'articolo o dell'evento dato, pronto per la pubblicazione sul sito web della Comunità Papa Giovanni XXIII.
  Se non hai ancora ricevuto in questa conversazione un link, un testo o un file sufficiente per il rilancio, chiedimi prima cosa manca, prima di procedere.
  Se ti è stato dato un URL dell'articolo o dell'evento originale, scaricalo SEMPRE con scraper_url_download prima di scrivere: non affidarti a una tua conoscenza pregressa dell'articolo, anche se ti sembra di conoscerlo già, perché potresti confonderlo con un altro articolo o riportare dati imprecisi. Se invece ti è stato dato solo un testo o un volantino, senza un link da cui scaricare, lavora su quel materiale.
  Usa il contenuto scaricato per ottenere tutte le informazioni necessarie per scrivere il testo di rilancio, e l'eventuale link all'immagine originale.

  Restituisci due campi separati:

  - "corpo": solo il testo del rilancio, senza titoli, conclusioni o commenti introduttivi, formattato in markdown. IMPORTANTE: non iniziare MAI la prima riga con un titolo in markdown (es. "## **Titolo del film**, ..." o simili, con doppio asterisco a inizio riga o preceduto da #/##). Il titolo dell'articolo viene aggiunto automaticamente altrove nella pubblicazione: se lo includi anche tu, comparirà duplicato. La prima riga deve essere direttamente il primo paragrafo di testo (prosa), non un'intestazione. Non inserire mai qui il link alla fonte: va SOLO nel campo "link" qui sotto.
  - "link": l'URL della pagina originale dell'articolo o dell'evento, quello vero che hai ricevuto o scaricato — mai inventato. Stringa vuota se non hai nessun link originale a disposizione (es. materiale arrivato solo come testo o volantino).
