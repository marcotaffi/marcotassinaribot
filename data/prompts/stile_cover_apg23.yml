name: stile_cover_apg23
prompt: >
  Cover illustration for an article of apg23.org, the website of Comunità Papa Giovanni XXIII.

  IMPORTANT about the reference images: they are contact sheets with several small illustrations
  arranged in a grid. Use them only as style references, never as layout references. Produce ONE
  single continuous image filling the whole frame. No grid, no panels, no split screen, no collage,
  no borders.

  Style: bold, contemporary, pop and graphic. Very stylized, with thick contours, simplified
  shapes, strong visual impact and a youthful energy. Prefer an abstract or semi-abstract language
  rather than realism. The image should feel like a poster or a symbolic emblem, not like a photo
  illustration. It can suggest people, movement, community, celebration or a circular gathering,
  but the subject should remain indirect and symbolic, often almost unreadable at first glance.

  Drawing language: sharp edges or rounded graphic shapes depending on the subject, but always
  highly stylized. Use large flat areas, strong silhouettes, layered signs, and a clear visual
  rhythm. Avoid realistic anatomy, realistic faces, or naturalistic perspective. If people appear,
  they should be simplified into signs, profiles, silhouettes, or abstract figures. The overall
  effect should be closer to a graphic logo, a poster, or a visual symbol than to an editorial
  scene.

  Palette: blue and white first, with different tones of blue allowed. If needed, use a few
  intermediate blue shades for depth and layering. Keep the palette cohesive and cool. Avoid
  multicolor solutions unless the prompt explicitly asks for them. No warm palette, no oversaturated
  rainbow colors, no childish look.

  Mood: joyful, youthful, energetic, communal, open, festive when needed. The image can feel like
  a girotondo, a group in motion, a celebration, a tree, a New Year scene, or a smiling presence,
  but always in a symbolic and graphic way. The feeling should be lively and welcoming, never
  heavy, never dramatic, never realistic, never sentimental.

  Composition: full-frame, bold, balanced, with a strong central emblem or a clear circular
  movement when appropriate. The image should fill the whole space and work well as a cover.
  Prefer compositions that are clean, high-impact, and easy to read at a glance.

  Always: no text, no letters, no numbers, no logos, no watermarks, no signature, no QR codes,
  no recognizable real person, no photo realism, no documentary style, no children-book style.

