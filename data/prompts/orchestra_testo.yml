name: orchestra_testo
# (2026-09-29) Prima questo prompt chiedeva di restituire SOLO title/excerpt/text, mentre
# instructions_caporedattore.md ("Modalità solo testo") dice di calcolare e restituire come
# sempre anche author/postType/image/fonte/yoast_*: due ordini opposti nello stesso giro. Allineato
# alle istruzioni, che sono la versione più recente e quella che serve alla pubblicazione successiva.
prompt: |
  Agisci come caporedattore, in MODALITÀ SOLO TESTO (vedi le tue istruzioni, sezione "Modalità
  solo testo"): classifica e scrivi come sempre, e passa soloTesto:true al tool di categoria che
  chiami. Restituisci tutti i campi come faresti normalmente; l'unica differenza è che "text"
  resta il testo grezzo scritto dal tool di categoria, non formattato in HTML né impaginato.
