name: stile_immagine
# Istruzioni FISSE anteposte al prompt variabile in ogni immagine libera generata dallo step
# genera_immagine: l'API immagini non ha un campo "instructions" separato, il prompt è l'unico
# ingresso testuale. Qui NON c'è uno stile di casa (tolto il 2026-10-09: le immagini libere non
# devono somigliare alle copertine del sito, che hanno il loro prompt e i loro provini in
# stile_cover_apg23): solo i divieti. Lo stile lo decide la richiesta dell'utente.
prompt: >
  Always: no text, no letters, no logos, no watermarks.
