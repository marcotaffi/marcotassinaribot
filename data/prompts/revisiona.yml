name: revisiona
# (2026-09-29) Uscita per campi separati: prima la proposta era testo libero con id, link,
# campi e spiegazioni mescolati, e chi la applicava doveva ritagliarla a mano. Il 28/09 una
# proposta intera ("Di seguito la proposta di nuovo evento…", "Cosa cambia"…) è finita dentro
# l'HTML da pubblicare. Vedi la sezione "Output" in snippets/instructions_revisore.md.
# (2026-09-29, sera) Un solo caso: la bozza. Anche un articolo già pubblicato si modifica
# aprendolo come bozza (bozze_apg23_apri), quindi il revisore non legge più il sito.
params:
  type:
    - title
    - excerpt
    - text
    - yoast_title
    - yoast_metadesc
    - linkBottone
    - testoBottone
    - cosaCambia
    - domanda
prompt: |
  Agisci come revisore: applica al testo della bozza qui sotto la modifica richiesta, seguendo le
  tue istruzioni, e restituiscila nei campi indicati nella sezione "Output".
