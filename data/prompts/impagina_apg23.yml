name: impagina_apg23
description: "Impagina l'HTML semplice (convertito dal markdown dal codice, step converti_html) nei blocchi dell'editor di apg23.org: una sezione acf/titolo-paragrafo-pulsante per ogni titoletto, bottone nell'ultima."
# (2026-09-29, deciso con Marco) Gli articoli si salvano sul sito nello stesso formato di quelli
# scritti con l'editor del sito (es. l'articolo su Lourdes, id 24248): blocchi ACF
# "titolo-paragrafo-pulsante", uno per sezione, e non più un blocco HTML unico del tema. Così un
# articolo del bot si modifica dal sito come tutti gli altri, e il bot può riaprirlo e modificarlo.
# La scrittura dei blocchi la fa questo agente (scelta di Marco); il validatore blocchi_wordpress
# (dati del modello in data/validators/blocchi_wordpress.yml) controlla testo, titoli, link,
# bottone e codici dei campi, e se qualcosa non va chiede una correzione.
# Il contenuto (parole, grassetti, corsivi, titoletti) lo decide chi scrive, nel markdown: qui si
# cambia solo la forma.
prompt: >
    Trasforma l'HTML già pronto (nel blocco "HTML DA IMPAGINARE" qui sotto) nei blocchi dell'editor
    di WordPress usati da apg23.org. Il contenuto — parole, ordine, titoletti, grassetti, corsivi,
    elenchi, link — non va toccato in nessun modo: cambia solo la forma, secondo queste regole.


    ═══════════════════════════════════════
    1. LE SEZIONI
    ═══════════════════════════════════════

    - Ogni titoletto <h2> apre una nuova sezione, e il suo testo (senza tag) va nel campo "titolo"
      di quella sezione.
    - Il testo prima del primo <h2>, se c'è, è una prima sezione con "titolo": "".
    - Tutto il resto fino al <h2> successivo va nel campo "paragrafo" della sezione.
    - Una riga [[blocco …]] (un carosello, un banner... che qui non si modifica) NON va dentro
      nessuna sezione: chiudi la sezione in corso, scrivi la riga identica, da sola, e riprendi con
      una nuova sezione con "titolo": "" se dopo c'è altro testo prima del prossimo <h2>.
    - Una riga [[bottone: SCRITTA | INDIRIZZO]] è il bottone della sezione in cui si trova: metti
      SCRITTA in "testo_pulsante" e INDIRIZZO nell'"url" di "link_pulsante" di quella sezione, e non
      scrivere la riga nel paragrafo. Se dopo c'è altro testo prima del prossimo <h2>, continua in
      una nuova sezione con "titolo": "". Nell'indirizzo di un bottone "&amp;" diventa "&": non è
      HTML, è l'indirizzo così com'è.


    ═══════════════════════════════════════
    2. IL CAMPO "paragrafo"
    ═══════════════════════════════════════

    - I paragrafi <p> si scrivono SENZA i tag <p> e </p>: solo il loro contenuto, uno dopo l'altro,
      separati esattamente da \r\n\r\n&nbsp;\r\n\r\n (così li separa l'editor del sito).
    - <strong>, <em>, <h3>, <ul>/<ol>/<li> e <blockquote> restano come sono. Un <h3>, un elenco o una
      citazione sono separati da ciò che sta prima e dopo con lo stesso separatore dei paragrafi.
    - Ogni link <a> ha target="_blank": se manca, aggiungilo. L'indirizzo resta identico.
    - Le virgolette caporali « e » si scrivono &laquo; e &raquo;.
    - Il campo è una stringa JSON: le virgolette " dentro l'HTML si scrivono \" e gli a capo solo
      come \r\n. Mai due trattini consecutivi (--) dentro il blocco: chiuderebbero il commento.


    ═══════════════════════════════════════
    3. IL BOTTONE A FINE ARTICOLO
    ═══════════════════════════════════════

    Il bottone dell'ultima sezione ti arriva in due blocchi a parte: "LINK DEL BOTTONE" (l'indirizzo)
    e "TESTO DEL BOTTONE" (la scritta). Usa quell'indirizzo e quella scritta esatti: non cercarli
    altrove, non inventarli, non riformulare la scritta. Se c'è il link ma la scritta è vuota, usa
    "Scopri di più". Se il link è vuoto o assente, l'ultima sezione non ha bottone: "testo_pulsante":
    "" e "link_pulsante": "". Mai una sezione in più solo per il bottone.

    Le sezioni senza bottone hanno "testo_pulsante": "" e "link_pulsante": "". Un bottone si scrive
    così: "link_pulsante":{"title":"","url":"INDIRIZZO","target":"_blank"}


    ═══════════════════════════════════════
    4. IL FORMATO DI OGNI SEZIONE
    ═══════════════════════════════════════

    Una riga per sezione, sempre con tutti questi campi, in quest'ordine e con questi valori fissi;
    cambiano solo TITOLO, PARAGRAFO, SCRITTA, il link del bottone e il margin-bottom ("3%" solo
    nell'ultima sezione, "" in tutte le altre):

    <!-- wp:acf/titolo-paragrafo-pulsante {"name":"acf/titolo-paragrafo-pulsante","data":{"titolo":"TITOLO","_titolo":"field_656a040e20f94","paragrafo":"PARAGRAFO","_paragrafo":"field_656a041d20f95","testo_pulsante":"SCRITTA","_testo_pulsante":"field_656a042920f96","link_pulsante":"","_link_pulsante":"field_656a043c20f97","allineamento_pulsante":"PulsanteLeft","_allineamento_pulsante":"field_656a044920f98","altezza":"","_altezza":"field_6564528ff236d","colore_sfondo":"#FFFFFF","_colore_sfondo":"field_65645262f236c","margin-top":"","_margin-top":"field_656452c0a404d","margin-bottom":"","_margin-bottom":"field_656452daa404e","larghezza":"SiteWidth","_larghezza":"field_6564592f93a06","ultimo_blocco":"0","_ultimo_blocco":"field_658c335e98322"},"mode":"edit"} /-->

    Esempio. Da questo HTML (con LINK DEL BOTTONE https://esempio.it/iscriviti e TESTO DEL BOTTONE
    "Iscriviti"):

    <p>Primo paragrafo con <strong>grassetto</strong>.</p>
    <p>Secondo paragrafo con un <a href="https://esempio.it">link</a>.</p>
    <h2>Come partecipare</h2>
    <p>Terzo paragrafo.</p>

    si ottiene:

    <!-- wp:acf/titolo-paragrafo-pulsante {"name":"acf/titolo-paragrafo-pulsante","data":{"titolo":"","_titolo":"field_656a040e20f94","paragrafo":"Primo paragrafo con <strong>grassetto</strong>.\r\n\r\n&nbsp;\r\n\r\nSecondo paragrafo con un <a href=\"https://esempio.it\" target=\"_blank\">link</a>.","_paragrafo":"field_656a041d20f95","testo_pulsante":"","_testo_pulsante":"field_656a042920f96","link_pulsante":"","_link_pulsante":"field_656a043c20f97","allineamento_pulsante":"PulsanteLeft","_allineamento_pulsante":"field_656a044920f98","altezza":"","_altezza":"field_6564528ff236d","colore_sfondo":"#FFFFFF","_colore_sfondo":"field_65645262f236c","margin-top":"","_margin-top":"field_656452c0a404d","margin-bottom":"","_margin-bottom":"field_656452daa404e","larghezza":"SiteWidth","_larghezza":"field_6564592f93a06","ultimo_blocco":"0","_ultimo_blocco":"field_658c335e98322"},"mode":"edit"} /-->

    <!-- wp:acf/titolo-paragrafo-pulsante {"name":"acf/titolo-paragrafo-pulsante","data":{"titolo":"Come partecipare","_titolo":"field_656a040e20f94","paragrafo":"Terzo paragrafo.","_paragrafo":"field_656a041d20f95","testo_pulsante":"Iscriviti","_testo_pulsante":"field_656a042920f96","link_pulsante":{"title":"","url":"https://esempio.it/iscriviti","target":"_blank"},"_link_pulsante":"field_656a043c20f97","allineamento_pulsante":"PulsanteLeft","_allineamento_pulsante":"field_656a044920f98","altezza":"","_altezza":"field_6564528ff236d","colore_sfondo":"#FFFFFF","_colore_sfondo":"field_65645262f236c","margin-top":"","_margin-top":"field_656452c0a404d","margin-bottom":"3%","_margin-bottom":"field_656452daa404e","larghezza":"SiteWidth","_larghezza":"field_6564592f93a06","ultimo_blocco":"0","_ultimo_blocco":"field_658c335e98322"},"mode":"edit"} /-->


    ═══════════════════════════════════════
    OUTPUT
    ═══════════════════════════════════════

    - Solo le sezioni (e le eventuali righe [[blocco …]]), una per riga, con una riga vuota fra
      l'una e l'altra. Nient'altro: nessun testo fuori dai blocchi, nessuna spiegazione.
    - NON avvolgere l'output in un blocco di codice markdown (niente ``` all'inizio o alla fine).
    - Verifica finale: tutte le parole dell'HTML ricevuto ci sono, identiche e nello stesso ordine;
      una sezione per ogni <h2>; il bottone del LINK DEL BOTTONE solo nell'ultima sezione;
      "margin-bottom":"3%" solo nell'ultima sezione.
