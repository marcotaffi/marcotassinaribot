name: impagina_apg23
description: "Impagina l'HTML semplice (convertito dal markdown dal codice, step converti_html) nel blocco unico del tema apg23/WordPress, con i dettagli propri di questo sito. Passaggio specifico di QUESTO sito: un WordPress generico avrebbe bisogno di un'impaginazione diversa (vedi TODO in fondo al file)."
# (2026-09-29) Da quando la conversione markdown→HTML è codice (HTML semplice e standard), i
# dettagli propri di apg23 che prima aggiungeva formatta_ai stanno qui: separatori fra i blocchi,
# link in una nuova pagina, virgolette caporali. Scelta di Marco: tenere all'agente di questo sito
# tutto ciò che è specifico del sito.
prompt: >
    Prendi l'HTML già pronto (nel blocco "HTML DA IMPAGINARE" qui sotto) e incollalo dentro il
    contenitore del tema apg23 qui sotto, applicando SOLO i dettagli del tema elencati nella sezione
    "DETTAGLI DEL TEMA APG23". Il contenuto (parole, ordine, titoletti, grassetti, corsivi, elenchi)
    non va toccato in nessun modo.


    ═══════════════════════════════════════
    DETTAGLI DEL TEMA APG23 (le UNICHE modifiche ammesse all'HTML ricevuto)
    ═══════════════════════════════════════

    - Fra un blocco e il successivo (paragrafi <p>, titoletti <h2>/<h3>, elenchi <ul>/<ol>,
      citazioni <blockquote>) inserisci un paragrafo separatore <p>&#8203;</p>. Non prima del primo
      blocco, non dopo l'ultimo, mai due di fila.
    - Ogni link <a ...> deve avere target="_blank": se manca, aggiungilo.
    - Le virgolette caporali « e » vanno scritte come &laquo; e &raquo;.


    ═══════════════════════════════════════
    STRUTTURA DA USARE (sempre e solo questa, un blocco unico)
    ═══════════════════════════════════════

    <div class="BlockWrapperContainer  Block-titolo-paragrafo-pulsante" style="background-color:#FFFFFF; margin-top:; margin-bottom:2%; height:">
      <div class="BlockMainContainer SiteWidth">
        <div class="BlockWrapper BlockTitoloParagrafoPulsante SiteWidth">
          <div class="BodyText">
             <div class="BodyText">
               (qui dentro l'HTML DA IMPAGINARE, con i soli dettagli del tema)
             </div>
          </div>
        </div>
      </div>
    </div>


    ═══════════════════════════════════════
    BOTTONE A FINE ARTICOLO (SOLO SE IL LINK DEL BOTTONE NON È VUOTO)
    ═══════════════════════════════════════

    Il bottone, se c'è, ti arriva in due blocchi a parte: "LINK DEL BOTTONE" (l'indirizzo) e "TESTO DEL BOTTONE" (la scritta). Può portare all'articolo originale di un rilancio o a una pagina d'azione (iscrizione, programma, donazione...): per te non cambia nulla. Usa quell'indirizzo e quella scritta esatti: non cercarli altrove nella conversazione, non inventarli, non riformulare la scritta. Se il blocco del link è vuoto o assente, non aggiungere nessun bottone. Se c'è il link ma la scritta è vuota, usa "Scopri di più".

    QUANDO hai un link, aggiungi PRIMA della chiusura del BodyText interno, SOSTITUENDO "LINK_BOTTONE" con l'indirizzo esatto e "TESTO_BOTTONE" con la scritta esatta — sono segnaposto da riempire, non testo da copiare:

      <div class="MainButtonBlockContainer PulsanteLeft">
        <a class="MainButton MainButtonDark" href="LINK_BOTTONE" target="_blank">
          TESTO_BOTTONE
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

    ERRORE GRAVE E FREQUENTE da evitare: NON creare un blocco a parte (es. con titolo "Fonte") solo per il bottone. Resta un solo blocco in tutto l'output, il bottone va incollato dentro il BodyText già esistente.


    ═══════════════════════════════════════
    OUTPUT
    ═══════════════════════════════════════

    - Restituisci SOLO il blocco HTML completo, a partire da <div class="BlockWrapperContainer...
    - Non modificare in alcun modo il contenuto HTML che hai ricevuto, a parte i dettagli del tema: nessuna riformulazione, nessuna correzione, nessuna aggiunta o rimozione di testo — ogni tag <h2>/<h3>/<strong>/<em> già presente resta com'è.
    - Nessun testo aggiuntivo.
    - Nessuna spiegazione.
    - NON avvolgere l'output in un blocco di codice markdown (niente ```html iniziale né ``` finale).
    - Verifica finale: è presente UN SOLO <div class="BlockWrapperContainer...">, nessuno di più.
    - Verifica finale: non esiste un blocco dedicato solo al bottone — il bottone è dentro l'unico blocco di contenuto.

