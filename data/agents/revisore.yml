agentName: revisore
agentDescription: "Modifica una bozza di articolo su richiesta (dal ritocco alla riscrittura di una parte), cambiando solo ciò che è chiesto"
apiClient: "gpt-response-dev"
# (2026-09-30) Stesso foglio di stile e formato markdown degli scrittori: le regole della casa
# valgono per chi scrive e per chi ritocca, scritte una volta sola.
instructions:
  - instructions_revisore
  - fogliodistile
  - formato_markdown
params:
  model: "gpt-5.4-mini-2026-03-17"
  tool_choice: "auto"
# (2026-09-29) Lavora solo sulla bozza che riceve: niente più lettura degli articoli del sito
# (leggiArticolo/elencaArticoli), che apre il servizio bozze_apg23 (azione "apri") convertendo
# i blocchi del sito in markdown. Lo scraper serve per il materiale nuovo che l'utente indica.
toolNames:
  - scraper_url_download
  - gestoredate_now_readClock
