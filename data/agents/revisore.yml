agentName: revisore
agentDescription: "Legge un articolo già pubblicato su apg23.org e propone una modifica, su richiesta — non scrive mai nulla da solo"
apiClient: "gpt-response-dev"
instructions:
  - instructions_revisore
params:
  model: "gpt-5.4-mini-2026-03-17"
  tool_choice: "auto"
toolNames:
  - wordpress_apg23_leggiArticolo
  # wordpress_apg23_elencaarticoli: SOLO su richiesta esplicita dell'utente di cercare/trovare
  # l'articolo (es. "cerca l'articolo sui nonni e aggiornalo") — vedi Caso B in
  # instructions_revisore.md. NON va usato per indovinare da solo, senza che l'utente lo chieda,
  # quale articolo pubblicato corrisponda a un materiale dato (bozza, PDF...): testato in
  # produzione il 2026-09-25, un tentativo automatico ha fallito a trovare un articolo che
  # esisteva davvero (termine di ricerca troppo lungo/diverso dal titolo vero) — il collegamento
  # bozza→articolo pubblicato è spesso conoscenza che solo l'utente ha, non deducibile in modo
  # affidabile dal solo contenuto.
  - wordpress_apg23_elencaarticoli
  - scraper_url_download
  - gestoredate_now_readClock
