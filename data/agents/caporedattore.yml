agentName: caporedattore
agentDescription: "Orchestratore - Sceglie il tool giornalistico da usare"
apiClient: "gpt-response-dev"
params:
  type: #json con questi campi
    - title
    - excerpt #subtitle
    - data_in_forma_testuale
    - luogo_evento
    - yoast_title
    - yoast_metadesc
    - postType
    - author
    - fonte
    - image
    - text
  model: "gpt-5.4-mini-2026-03-17"
  tool_choice: "required"
  then_tool_choice: "none"
  max_tool_calls: 1
  max_output_tokens: 6000
  temperature: 0.3
instructions: 
      - instructions_caporedattore
    #  - comelavorare_caporedattore
    #  - tools_caporedattore
    #  - esempi_caporedattore
toolNames:
      # scraper_url_download rimosso: con max_tool_calls:1 + then_tool_choice:"none" (vedi sopra)
      # il ciclo di chiamata concede UN SOLO giro di tool-call totale (non max_tool_calls giri,
      # vedi ciclo==1 in chatgptresponse.ts): se caporedattore lo spende per scaricare una
      # pagina, non gli resta modo di chiamare il tool di categoria e scrive l'articolo lui
      # stesso, saltando l'intera pipeline (es. formatta_ai per un rilancio). Classifica dal
      # link/contesto disponibile: il tool di categoria scelto scarica lui la pagina, ha già
      # scraper_url_download con tool_choice libero.
      - proceduratool_ripubblica
      - proceduratool_ufficiostampa
      - proceduratool_cronaca
      - proceduratool_interviste
      - proceduratool_dossier

    

