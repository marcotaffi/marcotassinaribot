agentName: caporedattore
agentDescription: "Sceglie la categoria di un contenuto da scrivere per apg23 e la fonte da indicare"
apiClient: "gpt-response-dev"
# (2026-09-29, revisione strutturale) Da orchestratore con tool a classificatore puro: prima
# chiamava come tool la procedura dello scrittore (un livello AI e una copia della sessione in più,
# regole tipo "chiama un solo tool una sola volta", tool_choice required/auto) e compilava a mano
# campi fissi (author) e copie dei campi dello scrittore. Ora restituisce solo categoria e fonte:
# la diramazione allo scrittore la fa la procedura _scrivi, i campi fissi uno step "valori", il
# tipo evento/articolo il titolista.
params:
  model: "gpt-5.4-mini-2026-03-17"
  tool_choice: "none"
  temperature: 0.2
  type:
    - categoria
    - fonte
    - motivo
instructions:
  - instructions_caporedattore
