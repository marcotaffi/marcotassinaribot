agentName: marcotassinari
agentDescription: "Marco Tassinari avatar"
apiClient: "gpt-response-dev"
# Persona conversazionale del bot (2026-09-25): la sua risposta finale parla all'utente, non è
# materiale per altri step. Vedi il commento su questo campo in taffitools/src/ai/types.ts —
# senza, una chiusura discorsiva rischia di essere scambiata per il "corpo" vero scritto da uno
# step di contenuto (bug reale osservato in produzione lo stesso giorno).
agenteConversazionale: true
params:
  model: "gpt-5.4-mini-2026-03-17"
  type: "text"
  temperature: 0.80
  top_p: 0.90 
  max_output_tokens: 6000
# (2026-09-29, revisione strutturale) Istruzioni divise in persona (chi è, tono, formato dei
# messaggi) e operativa (cosa fa sugli articoli). La cronaca dei bug che stava nelle istruzioni è
# stata tolta: resta nei commenti dei file e nel log git. Gli strumenti di scrittura, formattazione,
# impaginazione, pubblicazione e aggiornamento diretto non sono più qui: passano tutti dal servizio
# bozze_apg23, che lavora sulla bozza per numero (vedi data/services/bozze_apg23.yml).
instructions:
           - persona_marcotassinari
           - operativa_marcotassinari
           - esempi_marcotassinari
           - biografia_marcotassinari
toolNames:
           - gestoredate_now_readClock
           - sendmail_generic_post
           - scraper_url_download
           - websearch_italia_low
           # Bozze e modifiche di articoli apg23: scrivi, modifica, ritocca, ripristina, mostra,
           # elenca, anteprima, copertina, pubblica, esporta, rivediArticolo, applicaProposta.
           - bozze_apg23
           # Sola lettura del sito. L'aggiornamento diretto (aggiornaArticolo/aggiornaMedia) non è
           # più raggiungibile dalla chat: passa da bozze_apg23_applicaProposta, che applica solo
           # una proposta del revisore già mostrata (il 25/09 era stato usato senza proposta).
           - wordpress_apg23_leggiArticolo
           - wordpress_apg23_elencaarticoli
           - wordpress_apg23_elencarisorse
           # Genera un'immagine da una descrizione e la mostra in chat (procedure/_immagine.yml).
           - proceduratool_immagine
           # SeoZoom: ogni firma breve seozoom_<categoria> carica tutte le azioni di quella categoria.
           - seozoom_crediti
           - seozoom_keywords
           - seozoom_domains
           - seozoom_urls
           - seozoom_projects
