name: wordpress_apg23_invia
description: "Pubblica su apg23.org (riusa wordpress_apg23_post) via CanaleFlusso"
type: sequenziale
tasks:
  # Copertina generata SOLO se manca (e i campi con cui archiviarla). Tutti "opzionale: true":
  # se la generazione o la descrizione falliscono, l'articolo esce comunque — senza copertina o
  # coi campi di ripiego — invece di restare non pubblicato.
  # La copertina manca quando: non c'è un URL in "image" (immagine originale trovata dal
  # link, oppure indicata o generata in chat, che arriva qui come riferimento testuale) e non
  # c'è un'immagine passata come Multimedia dal tool "invia" (sorgente "image").
  # Vale sia per gli articoli sia per gli eventi. Wordpress.post usa l'immagine generata come
  # ultimo ripiego.
  - name: genera_prompt_cover_apg23
    type: step
    opzionale: true
    condizione: &senzaCopertina
      non:
        una:
          - campo: image
            operatore: truthy
          - campo: image
            modo: multimedia
            sorgente: image
            operatore: exists
  - name: genera_cover_apg23
    type: step
    opzionale: true
    condizione: *senzaCopertina
  # Campi di archiviazione della copertina (nome file, titolo, alt, parole chiave): serve sia per
  # l'immagine originale dell'articolo sia per quella generata qui sopra, quindi gira ogni volta
  # che una copertina c'è.
  - name: metadati_copertina
    type: step
    opzionale: true
    condizione:
      una:
        - campo: image
          operatore: truthy
        - campo: immagineGenerata
          modo: multimedia
          operatore: exists
        - campo: image
          modo: multimedia
          sorgente: image
          operatore: exists
  - name: wordpress_pubblica
    type: step
  # NESSUNA notifica a Mattia qui di proposito (a differenza di wordpress_apg23_pubblica.yml):
  # quando "invia" parte da chat è Marco stesso ad averlo confermato, e preferisce occuparsene
  # lui direttamente con Mattia invece di una mail automatica — la notifica resta riservata al
  # solo percorso automatico dal feed, dove nessun altro ha visto la bozza prima.
