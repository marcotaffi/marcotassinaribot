name: wordpress_apg23_pubblica
description: >
  Tappa della migrazione del canale wordpress_apg23 a CanaleFlusso (2026-09-18): stessi identici
  due step di scrivi/invia usati separatamente dai flussi "scrivi"/"invia", incatenati qui uno
  dopo l'altro per il percorso automatico dal feed (nessuna conferma, esattamente come faceva
  prima wordpress_apg23 con processFeed a 4 fasi fisse — preRun/run/prePost/post). Usata come
  flusso "principale" di ripubblica_apg23.yml.
type: sequenziale
tasks:
  - name: wordpress_scrivi
    type: step
  # Copertina generata SOLO se manca (e i campi con cui archiviarla). Tutti "opzionale: true":
  # se la generazione o la descrizione falliscono, l'articolo esce comunque — senza copertina o
  # coi campi di ripiego — invece di restare non pubblicato.
  # La copertina manca quando: non c'è un URL in "image" (immagine originale trovata dal
  # link, oppure indicata o generata in chat, che arriva qui come riferimento testuale) e non
  # c'è un'immagine passata come Multimedia dal tool "invia" (sorgente "image").
  # Vale sia per gli articoli sia per gli eventi. Wordpress.post usa l'immagine generata come
  # ultimo ripiego.
  - name: genera_prompt_cover_apg23
    type: step
    opzionale: true
    condizione: &senzaCopertina
      non:
        una:
          - campo: image
            operatore: truthy
          - campo: image
            modo: multimedia
            sorgente: image
            operatore: exists
  - name: genera_cover_apg23
    type: step
    opzionale: true
    condizione: *senzaCopertina
  # Campi di archiviazione della copertina (nome file, titolo, alt, parole chiave): serve sia per
  # l'immagine originale dell'articolo sia per quella generata qui sopra, quindi gira ogni volta
  # che una copertina c'è.
  - name: metadati_copertina
    type: step
    opzionale: true
    condizione:
      una:
        - campo: image
          operatore: truthy
        - campo: immagineGenerata
          modo: multimedia
          operatore: exists
        - campo: image
          modo: multimedia
          sorgente: image
          operatore: exists
  - name: wordpress_pubblica
    type: step
  # Notifica a chi revisiona davvero le bozze su apg23.org (Mattia): questo canale pubblica
  # sempre in stato "draft" (vedi opzioni.status in services/wordpress_apg23.yml). Qui, a
  # differenza del percorso chat, nessuno ha già visto la bozza prima che venga caricata — la
  # mail è l'unico modo con cui Mattia scopre che c'è qualcosa da rivedere.
  - name: componi_notifica_sitonews
    type: step
  - name: invia_notifica_sitonews
    type: step
