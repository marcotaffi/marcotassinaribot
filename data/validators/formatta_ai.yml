name: formatta_ai
description: "Regole di validazione per l'HTML semantico prodotto da formatta_ai (apg23/WordPress) — dal 2026-09-18 questo step non produce più blocchi/div del tema (vedi impagina_apg23), quindi qui restano solo le regole sulla sintassi HTML in sé."

estrazione:
  campo: corpo

regole:
  - id: code_fence
    vietato: '^```|```$'
    messaggio: "L'output è avvolto in un blocco di codice markdown (```html ... ```): va restituito solo HTML puro, senza fence."
